<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Music Room · 安静信笺 · 视觉稿</title>
<!--
  视觉稿，不是正式页面。
  方向：安静信笺（原研哉「空」的设计）。内容取自演示工作区，时长、进度等为示意。
  屏幕：#workspace #menu #compose #library #tasks；?theme=dark 切换夜间；?shot 隐藏切换条。
-->
<style>
:root{
  color-scheme:light;
  --paper:#f5f2ea;
  --paper-raised:#fbf9f4;
  --paper-sunk:#eeeae0;
  --paper-hover:#ebe6da;
  --paper-select:#e6e0d3;
  --ink:#24221e;
  --ink-2:#5c574e;
  --ink-3:#8c867a;
  --hair:#e2dccf;
  --hair-strong:#d2cab9;
  --seal:#b5402f;
  --seal-soft:#f2e2da;
  --danger:#9b3b2e;
  --warn:#9a6a1e;
  --on-ink:#fbf9f4;
  --wave:#cfc7b6;
  --wave-played:#24221e;
  --focus:0 0 0 2px var(--paper),0 0 0 4px #24221e55;

  --serif:"Iowan Old Style","Songti SC","Noto Serif SC","Source Han Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;

  --t-12:12px;--t-13:13px;--t-14:14px;--t-16:16px;--t-20:20px;--t-28:28px;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:48px;--s-8:64px;
  --r-1:4px;--r-2:6px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1b1a17;
  --paper-raised:#22211d;
  --paper-sunk:#171613;
  --paper-hover:#262420;
  --paper-select:#2c2a25;
  --ink:#ebe6db;
  --ink-2:#b4ad9f;
  --ink-3:#847e72;
  --hair:#2f2c27;
  --hair-strong:#3d3a33;
  --seal:#d6634e;
  --seal-soft:#3a2520;
  --danger:#d9705f;
  --warn:#d4a24c;
  --on-ink:#1b1a17;
  --wave:#44403a;
  --wave-played:#ebe6db;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 var(--t-14)/22px var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--focus)}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh;overflow:hidden}
.app.with-panel{grid-template-columns:232px minmax(0,1fr) 452px}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.scroll{flex:1;overflow:auto}
.page{max-width:920px;margin:0 auto;padding:var(--s-7) var(--s-7) var(--s-8)}

/* ---------- rail ---------- */
.rail{background:var(--paper-sunk);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:var(--s-5) var(--s-3) var(--s-4)}
.wordmark{font:500 19px/24px var(--serif);letter-spacing:.01em;padding:0 var(--s-3);margin-bottom:var(--s-6)}
.rail-label{display:flex;align-items:center;justify-content:space-between;padding:0 var(--s-2) 0 var(--s-3);margin-bottom:var(--s-1);font-size:var(--t-12);line-height:18px;color:var(--ink-3);letter-spacing:.08em}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-2);color:var(--ink-2)}
.icon-btn:hover{background:var(--paper-hover);color:var(--ink)}
.rail-item{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 var(--s-3);border-radius:var(--r-2);font-size:var(--t-14);color:var(--ink-2);text-align:left}
.rail-item:hover{background:var(--paper-hover);color:var(--ink)}
.rail-item.active{background:var(--paper-select);color:var(--ink);font-weight:500}
.rail-item .count{margin-left:auto;font-size:var(--t-12);color:var(--ink-3)}
.rail-item svg{color:var(--ink-3);flex:none}
.rail-item.active svg{color:var(--ink)}
.rail-gap{height:var(--s-6)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--s-2)}
.rail-foot-row{display:flex;align-items:center;gap:var(--s-1)}
.rail-foot-row .rail-item{flex:1}
.memory{display:block;width:100%;text-align:left;border-radius:var(--r-2)}
.memory:hover{background:var(--paper-hover)}
.live{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:var(--t-12);color:var(--ink-2)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.shot .live i,.shot .status.run i{animation:none}
.memory{padding:var(--s-2) var(--s-3);font-size:var(--t-12);line-height:18px;color:var(--ink-3)}
.memory b{font-weight:500;color:var(--ink-2)}
.meter{display:flex;gap:2px;margin-top:6px}
.meter span{flex:1;height:3px;border-radius:2px;background:var(--hair-strong)}
.meter span.on{background:var(--ink-2)}

/* ---------- headers ---------- */
.head{display:flex;align-items:flex-end;gap:var(--s-4);margin-bottom:var(--s-6)}
.head h1{font:500 var(--t-28)/36px var(--serif);letter-spacing:.02em}
.head .meta{margin-top:6px;font-size:var(--t-13);line-height:20px;color:var(--ink-3)}
.head .actions{margin-left:auto;display:flex;align-items:center;gap:var(--s-2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-2);font-size:var(--t-13);font-weight:500;color:var(--ink-2);white-space:nowrap}
.btn:hover{background:var(--paper-hover);color:var(--ink)}
.btn.line{border:1px solid var(--hair-strong);color:var(--ink)}
.btn.line:hover{border-color:var(--ink-3);background:transparent}
.btn.ink{background:var(--ink);color:var(--on-ink);padding:0 16px}
.btn.ink:hover{background:var(--ink);opacity:.88}
.btn.big{height:40px;padding:0 20px;font-size:var(--t-14)}
.btn.pressed{background:var(--paper-select);color:var(--ink);border:1px solid var(--hair-strong)}
.btn.sealed{color:var(--seal);border-color:color-mix(in oklab,var(--seal) 45%,transparent)}
.btn.sealed:hover{border-color:var(--seal)}
.btn.danger{color:var(--danger)}
.btn svg{flex:none}
.link{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--hair-strong);text-underline-offset:4px}
.link:hover{color:var(--ink);text-decoration-color:var(--ink-3)}

/* ---------- marks: 成品印章 / 灵感 ---------- */
.seal{display:inline-grid;place-items:center;height:20px;padding:0 6px;border-radius:2px;background:var(--seal);color:var(--paper-raised);font:500 11px/1 var(--serif);letter-spacing:.18em;padding-left:calc(6px + .18em);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--seal) 80%,#000)}
:root[data-theme="dark"] .seal{color:#1b1a17}
.mark{display:inline-grid;place-items:center;height:20px;padding:0 6px 0 calc(6px + .18em);border-radius:2px;border:1px solid color-mix(in oklab,var(--seal) 55%,transparent);color:var(--seal);font:500 11px/1 var(--serif);letter-spacing:.18em}

/* ---------- sound tabs ---------- */
.tabs{display:flex;align-items:flex-end;gap:var(--s-5);border-bottom:1px solid var(--hair);margin-bottom:var(--s-6)}
.tab{position:relative;display:flex;align-items:baseline;gap:8px;height:44px;padding-top:12px;color:var(--ink-3);font-size:15px;white-space:nowrap;flex:none}
.tab:hover{color:var(--ink)}
.tab small{font-size:var(--t-12);color:var(--ink-3)}
.tab.active{color:var(--ink);font-weight:500}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.tab-add{display:flex;align-items:center;gap:4px;height:44px;padding-top:10px;white-space:nowrap;flex:none;color:var(--ink-3);font-size:var(--t-13)}
.tab-add:hover{color:var(--ink)}
.tabs .push{margin-left:auto;padding-bottom:6px}

/* ---------- now playing ---------- */
.now{margin-bottom:var(--s-7)}
.now-top{display:flex;align-items:center;gap:var(--s-3)}
.vno{font:500 24px/30px var(--serif)}
.now-meta{margin-left:auto;font-size:var(--t-12);color:var(--ink-3)}
.brief{margin:10px 0 var(--s-5);font:400 17px/28px var(--serif);color:var(--ink-2)}
.player{display:grid;grid-template-columns:48px minmax(0,1fr);gap:var(--s-4);align-items:center}
.play{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.play.sm{width:28px;height:28px;background:transparent;color:var(--ink);border:1px solid var(--hair-strong)}
.play.sm:hover{border-color:var(--ink)}
.play.sm.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.play.sm[disabled]{color:var(--ink-3);border-style:dashed;cursor:default}
.wave{width:100%;height:56px}
.wave-time{display:flex;justify-content:space-between;margin-top:4px;font-size:var(--t-12);color:var(--ink-3)}
.now-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);margin-top:var(--s-5);padding-left:64px}
.now-actions .sep{width:1px;height:16px;background:var(--hair-strong);margin:0 var(--s-1)}
.now-actions .push{margin-left:auto}
.menu-anchor{position:relative}
.menu{position:absolute;right:0;top:38px;z-index:5;width:232px;padding:6px;background:var(--paper-raised);border:1px solid var(--hair);border-radius:var(--r-2);box-shadow:0 12px 32px -12px rgba(36,34,30,.25)}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;height:34px;padding:0 10px;border-radius:var(--r-1);font-size:var(--t-13);color:var(--ink);text-align:left}
.menu button:hover{background:var(--paper-hover)}
.menu button small{font-size:var(--t-12);color:var(--ink-3)}
.menu hr{border:0;border-top:1px solid var(--hair);margin:6px 4px}
.menu .danger{color:var(--danger)}
.menu-label{padding:6px 10px 2px;font-size:var(--t-12);color:var(--ink-3)}

/* ---------- version list ---------- */
.sec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:var(--s-2)}
.sec-head h2{font:500 var(--t-16)/24px var(--serif)}
.sec-head .n{font-size:var(--t-12);color:var(--ink-3)}
.sec-head .push{margin-left:auto;display:flex;gap:var(--s-1)}
.rows{border-top:1px solid var(--hair)}
.row{display:grid;grid-template-columns:28px 36px minmax(0,1fr) 120px 72px 44px 28px;align-items:center;gap:var(--s-3);min-height:56px;padding:0 var(--s-3);border-bottom:1px solid var(--hair)}
.row:hover{background:color-mix(in oklab,var(--paper-hover) 60%,transparent)}
.row.current{background:var(--paper-select)}
.row .v{font:500 var(--t-14)/20px var(--serif);color:var(--ink-2)}
.row.current .v{color:var(--ink)}
.row .desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;font-size:var(--t-12);line-height:18px;color:var(--ink-3)}
.row .marks{display:flex;gap:6px;justify-content:flex-end}
.row .dur{font-size:var(--t-12);color:var(--ink-3);text-align:right}
.row .more{opacity:0}
.row:hover .more,.row.current .more{opacity:1}
.mini{width:120px;height:20px}
.row.busy{grid-template-columns:28px 36px minmax(0,1fr) 236px 28px}
.stages{display:flex;gap:3px;margin-bottom:5px}
.stages span{flex:1;height:3px;border-radius:2px;background:var(--hair-strong)}
.stages span.done{background:var(--ink-3)}
.stages span.cur{background:var(--ink)}
.progress-text{font-size:var(--t-12);line-height:16px;color:var(--ink-3);white-space:nowrap}
.progress-text b{font-weight:500;color:var(--ink-2)}
.ring{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--hair-strong);border-top-color:var(--ink)}
.after{margin-top:var(--s-5);font-size:var(--t-13);color:var(--ink-3)}
.after .link{margin:0 4px}

/* ---------- compose panel ---------- */
.panel{display:flex;flex-direction:column;background:var(--paper-raised);border-left:1px solid var(--hair);min-width:0}
.panel-head{display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--s-5) var(--s-5) var(--s-4)}
.panel-head h2{font:500 var(--t-20)/28px var(--serif)}
.panel-head p{margin-top:2px;font-size:var(--t-12);line-height:18px;color:var(--ink-3)}
.panel-head .icon-btn{margin-left:auto}
.panel-body{flex:1;overflow:auto;padding:0 var(--s-5)}
.field{padding:var(--s-4) 0 var(--s-5);border-top:1px solid var(--hair)}
.field:first-child{border-top:0;padding-top:var(--s-2)}
.field-label{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--s-2);font-size:var(--t-13);font-weight:500;color:var(--ink)}
.field-label .link{font-weight:400;font-size:var(--t-12)}
.hint{margin-top:6px;font-size:var(--t-12);line-height:18px;color:var(--ink-3)}
.seg{display:inline-flex;padding:2px;border-radius:var(--r-2);background:var(--paper-sunk);border:1px solid var(--hair)}
.seg button{height:28px;padding:0 12px;border-radius:var(--r-1);font-size:var(--t-13);color:var(--ink-2)}
.seg button.on{background:var(--paper-raised);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(36,34,30,.12)}
:root[data-theme="dark"] .seg button.on{background:var(--paper-select)}
.textarea{width:100%;min-height:112px;padding:10px 12px;border:1px solid var(--hair-strong);border-radius:var(--r-2);background:var(--paper);font:400 var(--t-14)/24px var(--sans);color:var(--ink);resize:vertical}
.fold{display:flex;align-items:center;gap:var(--s-3);width:100%;min-height:48px;border-top:1px solid var(--hair);font-size:var(--t-13);color:var(--ink);text-align:left}
.fold small{margin-left:auto;font-size:var(--t-12);color:var(--ink-3)}
.fold svg{color:var(--ink-3)}
.panel-foot{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4) var(--s-5);border-top:1px solid var(--hair)}
.panel-foot .state{font-size:var(--t-12);line-height:18px;color:var(--ink-3)}
.panel-foot .btn{margin-left:auto}

/* ---------- list pages ---------- */
.toolbar{display:flex;align-items:center;gap:var(--s-3);margin-bottom:var(--s-3)}
.search{display:flex;align-items:center;gap:8px;flex:1;max-width:320px;height:34px;padding:0 2px;border-bottom:1px solid var(--hair-strong);color:var(--ink-3);font-size:var(--t-13)}
.select{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 8px;font-size:var(--t-13);color:var(--ink-2);border-radius:var(--r-2)}
.select:hover{background:var(--paper-hover)}
.toolbar .push{margin-left:auto;display:flex;gap:var(--s-2)}
.subtabs{display:flex;gap:var(--s-5);border-bottom:1px solid var(--hair);margin-bottom:var(--s-4)}
.subtabs button{position:relative;height:38px;font-size:var(--t-14);color:var(--ink-3)}
.subtabs button small{margin-left:6px;font-size:var(--t-12)}
.subtabs button.on{color:var(--ink);font-weight:500}
.subtabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) 160px 100px 52px 28px;align-items:center;gap:var(--s-3);min-height:52px;padding:0 var(--s-3);border-bottom:1px solid var(--hair)}
.lrow:hover{background:color-mix(in oklab,var(--paper-hover) 60%,transparent)}
.lrow.current{background:var(--paper-select)}
.lrow .t{font-weight:500}
.lrow .t span{font:500 var(--t-13) var(--serif);color:var(--ink-3);margin-left:6px}
.lrow .src{font-size:var(--t-13);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .marks{display:flex;gap:6px}
.lrow .dur{font-size:var(--t-12);color:var(--ink-3);text-align:right}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:var(--s-4);font-size:var(--t-12);color:var(--ink-3)}

.trow{display:grid;grid-template-columns:minmax(0,1.3fr) 96px minmax(0,1.4fr) 92px 112px;align-items:center;gap:var(--s-4);min-height:52px;padding:0 var(--s-3);border-bottom:1px solid var(--hair)}
.trow.headrow{min-height:36px;font-size:var(--t-12);color:var(--ink-3)}
.trow .t{font-weight:500}
.trow .t small{margin-left:8px;font-weight:400;font-size:var(--t-12);color:var(--ink-3)}
.trow .when{font-size:var(--t-12);color:var(--ink-3)}
.trow .ops{display:flex;justify-content:flex-end;gap:2px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-13)}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.status.run{color:var(--ink)}.status.run i{background:var(--ink);animation:breathe 1.2s ease-in-out infinite}
.status.queue{color:var(--ink-2)}.status.queue i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.status.wait{color:var(--warn)}.status.wait i{background:var(--warn)}
.status.fail{color:var(--danger)}.status.fail i{background:var(--danger)}
.status.ok{color:var(--ink-2)}

/* ---------- bottom player (声音库队列) ---------- */
.dock{display:grid;grid-template-columns:auto minmax(0,260px) minmax(0,1fr) auto;align-items:center;gap:var(--s-5);height:64px;padding:0 var(--s-6);border-top:1px solid var(--hair);background:var(--paper-raised)}
.dock .ctrl{display:flex;align-items:center;gap:var(--s-2)}
.dock .play{width:36px;height:36px}
.dock .title{min-width:0}
.dock .title b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .title small{display:block;font-size:var(--t-12);line-height:18px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .bar{display:flex;align-items:center;gap:var(--s-3);font-size:var(--t-12);color:var(--ink-3)}
.dock .bar .track{flex:1;height:3px;border-radius:2px;background:var(--hair-strong);position:relative}
.dock .bar .track span{position:absolute;inset:0 62% 0 0;border-radius:2px;background:var(--ink)}
.dock .right{display:flex;gap:var(--s-1)}


/* ---------- 新声音：类型选择 ---------- */
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
.kind{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid var(--hair-strong);border-radius:var(--r-2);text-align:left}
.kind b{font-weight:500;font-size:var(--t-14)}
.kind small{font-size:var(--t-12);line-height:18px;color:var(--ink-3)}
.kind:hover{border-color:var(--ink-3)}
.kind.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.input{width:100%;height:36px;padding:0 12px;border:1px solid var(--hair-strong);border-radius:var(--r-2);background:var(--paper);font:400 var(--t-14)/22px var(--sans);color:var(--ink)}
.steps{display:flex;gap:6px;margin-top:6px;font-size:var(--t-12);color:var(--ink-3)}
.steps b{font-weight:500;color:var(--ink)}

/* ---------- 任务与资源 ---------- */
.block{padding:var(--s-4) 0 var(--s-5);border-top:1px solid var(--hair);margin-bottom:var(--s-5)}
.block-head{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:var(--s-3)}
.block-head h2{font:500 var(--t-16)/24px var(--serif)}
.block-head .meta{font-size:var(--t-12);color:var(--ink-3)}
.block-head .push{margin-left:auto;display:flex;gap:var(--s-2)}
.dist{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:2px}
.dist span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-5);margin-top:var(--s-3);font-size:var(--t-12);color:var(--ink-3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.legend b{font-weight:500;color:var(--ink-2)}
.kv{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-5);margin-top:var(--s-4);font-size:var(--t-13);color:var(--ink-2)}
.kv span b{font-weight:500;color:var(--ink)}
.resident{display:flex;align-items:center;gap:var(--s-3);margin-top:var(--s-4);padding-top:var(--s-3);border-top:1px dashed var(--hair);font-size:var(--t-13)}

/* ---------- deterministic waveform ---------- */
function rand(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function bars(seed,n){const r=rand(seed);const out=[];let v=.4;for(let i=0;i<n;i++){const t=i/n;const env=.35+.65*Math.sin(Math.PI*Math.min(1,t*1.15))*(.75+.25*Math.sin(t*9));v=v*.55+r()*.45;out.push(Math.max(.08,Math.min(1,env*(.35+v*.8))));}return out;}
function wave(seed,{n=160,h=56,played=0,cls='wave',gap=2}={}){
  const b=bars(seed,n),w=1000,bw=w/n;
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${b.map((x,i)=>{const bh=Math.max(2,x*h);return `<rect x="${(i*bw+gap/2).toFixed(1)}" y="${((h-bh)/2).toFixed(1)}" width="${(bw-gap).toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="var(${i/n<played?'--wave-played':'--wave'})"/>`;}).join('')}</svg>`;
}

function library(){

    {t:'开场旁白',v:'V1',src:'雨巷来信',m:['seal'],d:'0:12'},
    {t:'主题曲',v:'V1',src:'雨巷来信',m:['mark'],d:'3:05'},
    {t:'钢琴 riff',v:'V1',src:'雨巷来信',m:['mark'],d:'0:58'},
    {t:'雨夜环境声',v:'',src:'外部导入 · WAV',m:[],d:'1:40'},

  return `<div class="app">
    ${rail('library')}

      <div class="right"><button class="select">顺序播放 ${I.down}</button><button class="btn">队列</button></div>

function newSoundPanel(){
  const kinds=[['音乐片段','riff、间奏、短旋律'],['完整音乐','歌曲或纯音乐'],['语音','旁白、朗读、开场白'],['音效','水声、打字等 1–5 秒短声'],['音色转换','替换人声音色，保留伴奏']];
  return `<aside class="panel" aria-label="新声音">
    <div class="panel-head"><div><h2>新声音</h2><p>雨巷来信 · 选好类型后直接填写第一版</p><div class="steps"><b>1 类型与名称</b><span>·</span><span>2 第一版要求</span></div></div><button class="icon-btn" aria-label="收起">${I.close}</button></div>
    <div class="panel-body">
      <div class="field"><div class="field-label">类型</div><div class="kinds">${kinds.map(([t,h],i)=>`<button class="kind ${i===2?'on':''}" aria-pressed="${i===2}"><b>${t}</b><small>${h}</small></button>`).join('')}</div></div>
      <div class="field"><div class="field-label">名称</div><input class="input" value="片尾旁白"><p class="hint">在页签和声音库中显示，之后可以改。</p></div>
    </div>
    <div class="panel-foot"><div class="state">语音模型已就绪</div><button class="btn ink big">下一步</button></div>
  </aside>`;
}
function resources(){
  const seg=[['系统保留',4.0,'var(--hair-strong)'],['其他应用',0.9,'var(--ink-3)'],['本程序',0.1,'var(--ink)'],['现在可用',11.0,'free']];
  const total=16;
  const queue=[
    {t:'雨巷来信 / 主题曲 · V4',s:'run',r:'<div class="stages" style="max-width:220px"><span class="done"></span><span class="cur"></span><span></span><span></span><span></span></div><div class="progress-text"><b>生成音乐内容</b> · <span class="num">12 / 32</span> · 已运行 3:20</div>',a:'取消'},
    {t:'雨巷来信 / 开场旁白 · V3',s:'queue',r:'<span class="progress-text">前面 1 项 · 需约 5 GB</span>',a:'取消'},
  ];
  const label={run:'生成中',queue:'排队中',wait:'等待内存',ok:'已完成'};
  return `<div class="app">
    ${rail('tasks')}
    <main class="main">${mobileBar()}<div class="scroll"><div class="page">
      <div class="head"><div><h1>任务与资源</h1><div class="meta">生成在本机后台逐项进行，关闭网页不会中断</div></div>
        <div class="actions"><button class="btn line">暂停后续任务</button></div></div>
      <section class="block" aria-label="本机资源">
        <div class="block-head"><h2>本机资源</h2><span class="meta num">内存压力 正常 · 采样 18:05:55</span><div class="push"><button class="link">调整内存上限</button></div></div>
        <div class="dist" role="img" aria-label="内存分布">${seg.map(([n,v,c])=>`<span style="width:${v/total*100}%;${c==='free'?'box-shadow:inset 0 0 0 1px var(--ink-3)':'background:'+c}" title="${n} ${v} GiB"></span>`).join('')}</div>
        <div class="legend num">${seg.map(([n,v,c])=>`<span><i style="${c==='free'?'box-shadow:inset 0 0 0 1px var(--ink-3)':'background:'+c}"></i>${n} <b>${v.toFixed(1)} GiB</b></span>`).join('')}</div>
        <div class="kv num"><span>总内存 <b>16.0 GiB</b></span><span>应用上限 <b>12.0 GiB</b>（自动）</span><span>启动新任务最多可用 <b>11.0 GiB</b></span></div>
        <div class="resident"><span>模型驻留</span><b>音乐 · YuE2</b><span style="color:var(--ink-3)">运行中</span><div class="push">有任务运行时不能释放<button class="btn line" disabled>释放空闲模型</button></div></div>
        <button class="fold" style="margin-top:var(--s-3);border-bottom:1px solid var(--hair)">详细数据<small>CPU、压缩、交换、预算明细</small>${I.right}</button>
      </section>
      <section class="block" aria-label="进行中与排队">
        <div class="block-head"><h2>进行中与排队</h2><span class="meta">2 项</span></div>
        <div class="rows">${queue.map(x=>`<div class="trow"><div class="t">${x.t}</div><span class="status ${x.s}"><i></i>${label[x.s]}</span><div>${x.r}</div><span class="when num">18:06</span><div class="ops"><button class="btn">${x.a}</button><span style="width:28px"></span></div></div>`).join('')}</div>
      </section>
      <section class="block" aria-label="历史">
        <div class="block-head"><h2>历史</h2><div class="push"><div class="seg"><button class="on">全部 <span class="num">6</span></button><button>已完成 <span class="num">6</span></button></div><button class="select">其他状态 ${I.down}</button><div class="search" style="width:200px">${I.search}<span>搜索</span></div></div></div>
        <div class="rows">${[['开场旁白 · V2','0:12'],['开场旁白 · V1','0:12'],['钢琴 riff · V1','0:58'],['主题曲 · V3','3:02']].map(([t,d])=>`<div class="trow"><div class="t">${t}<small>雨巷来信</small></div><span class="status ok"><i></i>已完成</span><div><span class="num" style="color:var(--ink-3)">${d} · 已保存</span></div><span class="when num">11/19 18:04</span><div class="ops"><button class="btn">试听</button><button class="icon-btn" aria-label="更多">${I.more}</button></div></div>`).join('')}</div>
      </section>
    </div></div></main>
  </div>`;
}
function settingsPage(){
  const engines=[
    ['音乐 · YuE2','已启用，生成时加载','停止'],
    ['语音 · Breeze / IndexTTS','已准备，生成时加载',''],
    ['音色转换 · Seed-VC','已准备',''],
    ['音效 · Stable Audio','尚未准备 · 首次使用时下载','准备模型'],
    ['同步歌词 · Qwen3-ASR','尚未准备','准备模型'],
  ];
  return `<div class="app">
    ${rail('settings')}
    <main class="main">${mobileBar()}<div class="scroll"><div class="page" style="max-width:1000px">
      <div class="head"><div><h1>设置</h1><div class="meta num">工作目录 ~/Music/MusicRoom</div></div></div>
      <div class="settings">
        <nav class="subnav" aria-label="设置小节">${['模型','内存与资源','回收站','备份与恢复','Agent 连接','外观','关于'].map((n,i)=>`<button class="${i===0?'on':''}">${n}</button>`).join('')}</nav>
        <div>
          <section class="block" style="border-top:0;padding-top:0">
            <div class="block-head"><h2>模型</h2><span class="meta">只在生成时加载，结束后释放</span></div>
            ${engines.map(([n,st,a])=>`<div class="srow"><div><b>${n}</b><p class="${a==='准备模型'?'':'ok'}">${st}</p></div><div class="acts">${a?`<button class="btn line">${a}</button>`:''}<button class="btn">目录与日志</button></div></div>`).join('')}
          </section>
          <section class="block">
            <div class="block-head"><h2>内存与资源</h2></div>
            <div class="srow"><div><b>应用内存上限</b><p>实际额度取所填上限与默认安全额度的较小值；有任务时不能修改。</p></div><div class="acts"><div class="seg"><button class="on">自动</button><button>手动</button></div></div></div>
          </section>
          <section class="block">
            <div class="block-head"><h2>外观</h2></div>
            <div class="srow"><div><b>主题</b><p>夜间模式使用同一套纸墨配色的深色版本。</p></div><div class="acts"><div class="seg"><button>日间</button><button>夜间</button><button class="on">跟随系统</button></div></div></div>
          </section>
        </div>
      </div>
    </div></div></main>
  </div>`;
}

const screens={workspace:()=>workspace(),menu:()=>workspace({menuOpen:true}),compose:()=>workspace({panel:true}),newsound:()=>workspace({panel:'new'}),library,tasks:resources,settings:settingsPage};
function render(){
  const key=(location.hash.slice(1)||'workspace');
  document.getElementById('root').innerHTML=(screens[key]||screens.workspace)()+
    `<nav class="switcher"><span>视觉稿</span>${Object.keys(screens).map(k=>`<a href="#${k}" class="${k===key?'on':''}">${{workspace:'工作区',menu:'更多菜单',compose:'创作面板',newsound:'新声音',library:'声音库',tasks:'任务与资源',settings:'设置'}[k]}</a>`).join('')}<a href="?${params.get('theme')==='dark'?'':'theme=dark'}${location.hash}">${params.get('theme')==='dark'?'日间':'夜间'}</a></nav>`;
}
addEventListener('hashchange',render);render();
</script>
